{% extends "base.html" %}
{% block title %}Thông báo{% endblock %}
{% block body %}
<p class="muted">Đăng một thông báo tuỳ ý (sự kiện, cập nhật, nhắc nhở an toàn…) lên kênh cộng đồng dưới tên bot.</p>
<form method="post" action="/announce" class="panel" onsubmit="return confirm('Đăng thông báo này lên các kênh đã chọn?')">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label for="text">Nội dung</label>
  <textarea id="text" name="text" rows="8" required></textarea>
  <div style="margin-top:8px">
    <label class="inline"><input type="checkbox" name="tg" checked> Telegram ({{ tg_target or 'chưa đặt ID' }})</label>
    <label class="inline"><input type="checkbox" name="dc" checked> Discord ({{ dc_target or 'chưa đặt ID' }})</label>
  </div>
  <button type="submit">Đăng thông báo</button>
</form>
{% endblock %}
